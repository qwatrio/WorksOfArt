{% extends "base.html" %}

{% block title %}Балет и Опера{% endblock %}

{% block content %}
<div class="container">
    <h1>🎭 Балет и Опера</h1>
    <input type="text" id="searchInput" placeholder="Поиск постановки или композитора..." class="search-box">

    <div class="grid" id="itemsGrid">
        {% for item in items %}
        <div class="item" data-title="{{ (item.title + ' ' + item.artist)|lower }}">
            <div class="item-header" onclick="toggleVideo(this)">
                <img src="{{ item.thumbnail }}" alt="{{ item.title }}" class="thumbnail">
                <div class="play-overlay">
                    <span class="play-icon">▶</span>
                </div>
            </div>
            <div class="item-content">
                <h3>{{ item.title }}</h3>
                <p class="artist">{{ item.artist }}</p>
                <p>{{ item.description }}</p>
            </div>
            <div class="video-player" style="display: none;">
                <video controls width="100%">
                    <source src="{{ item.url }}" type="video/mp4">
                </video>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
