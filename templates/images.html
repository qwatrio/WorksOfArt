{% extends "base.html" %}

{% block title %}Живопись{% endblock %}

{% block content %}
<div class="container">
    <h1>🎨 Галерея Живописи</h1>
    <input type="text" id="searchInput" placeholder="Поиск картины или художника..." class="search-box">

    <div class="grid" id="itemsGrid">
        {% for item in items %}
        <div class="item" data-title="{{ (item.title + ' ' + item.artist)|lower }}" onclick="openFullscreen('{{ item.url }}', '{{ item.title }}', '{{ item.artist }}')">
            <img src="{{ item.url }}" alt="{{ item.title }}" class="artwork-preview">
            <div class="item-content">
                <h3>{{ item.title }}</h3>
                <p class="artist">{{ item.artist }}</p>
                <p>{{ item.year }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Fullscreen overlay для картинок -->
<div id="fullscreenOverlay" class="fullscreen-overlay">
    <img id="fullscreenImage" src="" alt="">
    <div class="fullscreen-info">
        <h2 id="fullscreenTitle"></h2>
        <p id="fullscreenArtist"></p>
    </div>
    <div class="fullscreen-close">ESC или клик для закрытия</div>
</div>
{% endblock %}
