{% extends "base.html" %}

{% block title %}Живопись{% endblock %}

{% block content %}
<div class="container">
    <h1>Галерея Живописи</h1>
    <input type="text" id="searchInput" placeholder="Поиск картины или художника..." class="search-box">

    <div class="grid" id="itemsGrid">
        {% for item in items %}
        <div class="item" data-title="{{ (item.title + ' ' + item.artist)|lower }}">
            <img src="{{ item.url }}" alt="{{ item.title }}">
            <div class="item-content">
                <h3>{{ item.title }}</h3>
                <p class="artist">{{ item.artist }}</p>
                <p>{{ item.year }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
